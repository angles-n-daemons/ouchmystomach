<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pri:#2a9d8f;--pri-dk:#21867a;--pri-lt:#e8f5f3;--txt:#264653;--txt-lt:#6b7f8a;--bg:#f7fafa;--card:#fff;--bdr:#d4e4e1;--shd:0 2px 12px rgba(42,157,143,.12);--r:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px}
.container{width:100%;max-width:480px}
.setup-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--r);padding:14px 16px;margin-bottom:20px;font-size:14px;line-height:1.5}
.setup-banner strong{display:block;margin-bottom:4px}
.setup-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:13px}
.header{text-align:center;padding:24px 0 8px}
.header h1{font-size:26px;font-weight:700;color:var(--pri)}
.header p{color:var(--txt-lt);font-size:14px;margin-top:4px}
.landing{display:flex;flex-direction:column;gap:16px;margin-top:32px}
.landing-btn{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:22px 20px;font-size:18px;font-weight:600;color:var(--txt);cursor:pointer;transition:all .15s;box-shadow:var(--shd)}
.landing-btn:hover,.landing-btn:focus{border-color:var(--pri);background:var(--pri-lt)}
.landing-btn .icon{font-size:32px;line-height:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shd);padding:24px 20px;margin-top:20px}
.back-btn{background:none;border:none;color:var(--pri);font-size:15px;font-weight:600;cursor:pointer;padding:0 0 12px;display:inline-flex;align-items:center;gap:4px}
.back-btn:hover{text-decoration:underline}
.form-title{font-size:20px;font-weight:700;margin-bottom:20px}
label.field-label{display:block;font-size:13px;font-weight:600;color:var(--txt-lt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field{margin-bottom:18px}
input[type="datetime-local"],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-size:15px;font-family:inherit;color:var(--txt);background:#fff;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
textarea{resize:vertical;min-height:60px}
.multi-select-wrap{position:relative}
.ms-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:0}
.ms-chips:empty{margin-bottom:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--pri-lt);color:var(--pri-dk);border:1px solid var(--pri);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:500}
.chip-x{cursor:pointer;font-size:15px;line-height:1;opacity:.6}
.chip-x:hover{opacity:1}
.ms-input{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-size:15px;font-family:inherit;color:var(--txt);background:#fff}
.ms-input:focus{outline:none;border-color:var(--pri)}
.ms-dropdown{position:absolute;left:0;right:0;top:100%;background:#fff;border:1.5px solid var(--bdr);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.1);display:none}
.ms-dropdown.open{display:block}
.ms-option{padding:10px 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.ms-option:hover,.ms-option.highlight{background:var(--pri-lt)}
.ms-option.selected{color:var(--pri);font-weight:600}
.ms-option .check{width:16px;text-align:center}
.ms-no-results{padding:10px 12px;color:var(--txt-lt);font-size:14px;font-style:italic}
.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--bdr);border-radius:8px;cursor:pointer;font-size:14px;transition:all .15s;user-select:none}
.cb-item:hover{border-color:var(--pri)}
.cb-item.checked{background:var(--pri-lt);border-color:var(--pri);color:var(--pri-dk);font-weight:500}
.cb-item input{display:none}
.cb-box{width:18px;height:18px;border:2px solid var(--bdr);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .15s}
.cb-item.checked .cb-box{background:var(--pri);border-color:var(--pri);color:#fff}
.severity-row{display:flex;gap:8px}
.sev-btn{flex:1;padding:10px 0;border:1.5px solid var(--bdr);border-radius:8px;background:#fff;font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;color:var(--txt)}
.sev-btn:hover{border-color:var(--pri)}
.sev-btn.active{background:var(--pri);border-color:var(--pri);color:#fff}
.submit-btn{width:100%;padding:14px;border:none;border-radius:8px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:6px}
.submit-btn:hover{background:var(--pri-dk)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;color:#fff;opacity:0;transition:all .3s;z-index:100;text-align:center;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--pri)}
.toast.error{background:#e76f51}
.screen{display:none}
.screen.active{display:block}
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.auth-screen p{color:var(--txt-lt);margin-bottom:24px;font-size:15px}
.auth-screen .icon{font-size:48px;margin-bottom:16px}
.auth-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:1.5px solid var(--bdr);border-radius:8px;background:#fff;font-size:15px;font-weight:500;color:var(--txt);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:all .15s}
.auth-btn:hover{border-color:var(--pri);background:var(--pri-lt)}
.auth-btn svg{flex-shrink:0}
.signed-in-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-top:8px;font-size:13px;color:var(--txt-lt)}
.sign-out-btn{background:none;border:none;color:var(--pri);font-size:13px;font-weight:600;cursor:pointer;padding:0}
.sign-out-btn:hover{text-decoration:underline}
</style>
<script src="https://accounts.google.com/gsi/client" onload="window._gisReady=true;if(window._domReady)initGIS()"></script>
</head>
<body>
<div class="container">
  <div class="setup-banner" id="setupBanner" style="display:none">
    <strong>Setup Required</strong>
    Open <code>index.html</code> and set <code>GOOGLE_CLIENT_ID</code>. Enable the Google Sheets API in your Cloud Console project.
  </div>
  <div class="header">
    <h1>Food Tracker</h1>
    <p>Log meals and symptoms</p>
  </div>
  <div class="screen active" id="screenAuth">
    <div class="card auth-screen">
      <div class="icon">🍽️</div>
      <p>Sign in with your Google account to log meals and symptoms</p>
      <button class="auth-btn" id="googleSignInBtn" onclick="doSignIn()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#FBBC05" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>
  <div class="screen" id="screenLanding">
    <div class="signed-in-bar">
      <span id="signedInAs"></span>
      <button class="sign-out-btn" onclick="signOut()">Sign out</button>
    </div>
    <div class="landing">
      <button class="landing-btn" onclick="showScreen('meal')">
        <span class="icon">&#127957;</span><span>Log a Meal</span>
      </button>
      <button class="landing-btn" onclick="showScreen('symptom')">
        <span class="icon">&#129658;</span><span>Log Symptoms</span>
      </button>
    </div>
  </div>
  <div class="screen" id="screenMeal">
    <div class="card">
      <button class="back-btn" onclick="showScreen('landing')">&#8592; Back</button>
      <div class="form-title">Log a Meal</div>
      <div class="field">
        <label class="field-label" for="mealDateTime">Date &amp; Time</label>
        <input type="datetime-local" id="mealDateTime">
      </div>
      <div class="field">
        <label class="field-label" for="mealType">Meal Type</label>
        <select id="mealType">
          <option value="" disabled selected>Select&#8230;</option>
          <option value="Healthy">Healthy</option>
          <option value="Average">Average</option>
          <option value="Unhealthy">Unhealthy</option>
          <option value="Snack">Snack</option>
          <option value="Junk">Junk</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Contents</label>
        <div class="multi-select-wrap" id="contentsWrap">
          <div class="ms-chips" id="contentsChips"></div>
          <input type="text" class="ms-input" id="contentsInput" placeholder="Search foods&#8230;" autocomplete="off">
          <div class="ms-dropdown" id="contentsDropdown"></div>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="mealNotes">Notes</label>
        <textarea id="mealNotes" placeholder="Optional notes&#8230;"></textarea>
      </div>
      <button class="submit-btn" id="mealSubmit" onclick="submitMeal()">Log Meal</button>
    </div>
  </div>
  <div class="screen" id="screenSymptom">
    <div class="card">
      <button class="back-btn" onclick="showScreen('landing')">&#8592; Back</button>
      <div class="form-title">Log Symptoms</div>
      <div class="field">
        <label class="field-label" for="symptomDateTime">Date &amp; Time</label>
        <input type="datetime-local" id="symptomDateTime">
      </div>
      <div class="field">
        <label class="field-label">Severity</label>
        <div class="severity-row" id="severityRow">
          <button class="sev-btn" data-val="1" onclick="pickSeverity(this)">1</button>
          <button class="sev-btn" data-val="2" onclick="pickSeverity(this)">2</button>
          <button class="sev-btn" data-val="3" onclick="pickSeverity(this)">3</button>
          <button class="sev-btn" data-val="4" onclick="pickSeverity(this)">4</button>
          <button class="sev-btn" data-val="5" onclick="pickSeverity(this)">5</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Symptoms</label>
        <div class="checkbox-grid" id="symptomGrid"></div>
      </div>
      <div class="field">
        <label class="field-label" for="symptomNotes">Notes</label>
        <textarea id="symptomNotes" placeholder="Optional notes&#8230;"></textarea>
      </div>
      <button class="submit-btn" id="symptomSubmit" onclick="submitSymptom()">Log Symptoms</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ============ CONFIG ============
const GOOGLE_CLIENT_ID='246027516250-ps26o81ohvj9ujceb66l4g9u03tkos8p.apps.googleusercontent.com';
const SPREADSHEET_ID='13O1iwibCq5UBzpi_2U9DO_qhlGrG4BdAyM8XddNIoS4';
// ================================

const SHEETS_API='https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+'/values/';
const FOODS=['Apples','Asparagus','Avocado','Banana','Beans','Beef','Blueberry','Bread','Broccoli','Carrot','Cereal','Cheese','Chicken','Chips','Chocolate','Coffee','Corn','Cucumber','Eggplant','Eggs','Fish','Grapes','Hummus','Ice Cream','Kale','Lentils','Lettuce','Mango','Milk','Mushrooms','Noodles','Oatmeal','Onion','Oranges','Pasta','Peanut Butter','Pears','Pepper','Pizza','Pork','Potato','Quinoa','Raspberry','Rice','Salmon','Spinach','Strawberry','Sweet Potato','Tea','Tofu','Tomato','Trail Mix','Turkey','Watermelon','Yogurt'];
const SYMPTOMS=['Stomach Ache','Diarrhea','Bloating','Nausea','Heartburn','Cramps','Gas','Constipation','Acid Reflux','Fatigue','Headache'];
let selectedFoods=[],selectedSeverity='',selectedSymptoms=[];
let accessToken=null;
let highlightIdx=-1;
let tokenClient=null;

function initGIS(){
  if(!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID==='YOUR_GOOGLE_CLIENT_ID')return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets',
    callback:handleTokenResponse
  });
  // Try to restore a cached token
  const cached=localStorage.getItem('ft_token');
  const expiry=parseInt(localStorage.getItem('ft_token_expiry')||'0',10);
  const name=localStorage.getItem('ft_user_name')||'';
  if(cached&&Date.now()<expiry){
    accessToken=cached;
    document.getElementById('signedInAs').textContent=name?'Signed in as '+name:'Signed in';
    showScreen('landing');
  }else{
    // Clear stale cache and try silent re-auth
    localStorage.removeItem('ft_token');
    localStorage.removeItem('ft_token_expiry');
    tokenClient.requestAccessToken({prompt:''});
  }
}

function doSignIn(){
  if(!tokenClient){showToast('Google Sign-In not loaded yet — try again in a moment.','error');return;}
  tokenClient.requestAccessToken();
}

function handleTokenResponse(response){
  if(response.error){
    // Silent re-auth failed — just show sign-in screen (not an error toast)
    showScreen('auth');
    return;
  }
  accessToken=response.access_token;
  // Cache token with expiry (expires_in is in seconds, subtract 60s buffer)
  const expiresIn=(response.expires_in||3600)-60;
  localStorage.setItem('ft_token',accessToken);
  localStorage.setItem('ft_token_expiry',String(Date.now()+expiresIn*1000));
  // Fetch user info to display name
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+accessToken}})
    .then(r=>r.json())
    .then(info=>{
      const name=info.name||info.email||'';
      localStorage.setItem('ft_user_name',name);
      document.getElementById('signedInAs').textContent=name?'Signed in as '+name:'Signed in';
    })
    .catch(()=>{
      document.getElementById('signedInAs').textContent='Signed in';
    });
  showScreen('landing');
}

function signOut(){
  if(accessToken)google.accounts.oauth2.revoke(accessToken);
  accessToken=null;
  localStorage.removeItem('ft_token');
  localStorage.removeItem('ft_token_expiry');
  localStorage.removeItem('ft_user_name');
  document.getElementById('signedInAs').textContent='';
  showScreen('auth');
}

document.addEventListener('DOMContentLoaded',()=>{
  if(!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID==='YOUR_GOOGLE_CLIENT_ID')document.getElementById('setupBanner').style.display='block';
  window._domReady=true;
  if(window._gisReady)initGIS();
  setDateTimeNow('mealDateTime');
  setDateTimeNow('symptomDateTime');
  const grid=document.getElementById('symptomGrid');
  SYMPTOMS.forEach(s=>{
    const item=document.createElement('label');
    item.className='cb-item';
    item.innerHTML='<input type="checkbox" value="'+s+'"><span class="cb-box"></span><span>'+s+'</span>';
    item.addEventListener('click',e=>{
      e.preventDefault();
      const cb=item.querySelector('input');
      cb.checked=!cb.checked;
      item.classList.toggle('checked',cb.checked);
      item.querySelector('.cb-box').textContent=cb.checked?'\u2713':'';
      if(cb.checked)selectedSymptoms.push(s);
      else selectedSymptoms=selectedSymptoms.filter(x=>x!==s);
    });
    grid.appendChild(item);
  });
  const input=document.getElementById('contentsInput');
  const dropdown=document.getElementById('contentsDropdown');
  input.addEventListener('focus',()=>{highlightIdx=-1;renderFoodDropdown();});
  input.addEventListener('input',()=>{highlightIdx=-1;renderFoodDropdown();});
  input.addEventListener('keydown',e=>{
    const opts=dropdown.querySelectorAll('.ms-option');
    if(!opts.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();highlightIdx=Math.min(highlightIdx+1,opts.length-1);updateHighlight(opts);}
    else if(e.key==='ArrowUp'){e.preventDefault();highlightIdx=Math.max(highlightIdx-1,0);updateHighlight(opts);}
    else if(e.key==='Enter'&&highlightIdx>=0){e.preventDefault();const food=opts[highlightIdx].querySelector('span:last-child').textContent;toggleFood(food);}
    else if(e.key==='Escape'){e.preventDefault();dropdown.classList.remove('open');highlightIdx=-1;input.blur();}
  });
  document.addEventListener('click',e=>{
    if(!document.getElementById('contentsWrap').contains(e.target))dropdown.classList.remove('open');
  });
});

function setDateTimeNow(id){
  const now=new Date();
  now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById(id).value=now.toISOString().slice(0,16);
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  if(name==='auth')document.getElementById('screenAuth').classList.add('active');
  else if(name==='landing')document.getElementById('screenLanding').classList.add('active');
  else if(name==='meal'){setDateTimeNow('mealDateTime');document.getElementById('screenMeal').classList.add('active');}
  else if(name==='symptom'){setDateTimeNow('symptomDateTime');document.getElementById('screenSymptom').classList.add('active');}
}

function renderFoodDropdown(){
  const input=document.getElementById('contentsInput');
  const dropdown=document.getElementById('contentsDropdown');
  const q=input.value.toLowerCase().trim();
  const filtered=FOODS.filter(f=>f.toLowerCase().includes(q));
  dropdown.innerHTML='';
  if(!filtered.length){dropdown.innerHTML='<div class="ms-no-results">No matches</div>';}
  else filtered.forEach((food,i)=>{
    const sel=selectedFoods.includes(food);
    const opt=document.createElement('div');
    opt.className='ms-option'+(sel?' selected':'')+(i===highlightIdx?' highlight':'');
    opt.innerHTML='<span class="check">'+(sel?'\u2713':'')+'</span><span>'+food+'</span>';
    opt.addEventListener('click',e=>{e.stopPropagation();toggleFood(food);});
    dropdown.appendChild(opt);
  });
  dropdown.classList.add('open');
}

function updateHighlight(opts){
  opts.forEach((o,i)=>{o.classList.toggle('highlight',i===highlightIdx);});
  if(opts[highlightIdx])opts[highlightIdx].scrollIntoView({block:'nearest'});
}

function toggleFood(food){
  if(selectedFoods.includes(food))selectedFoods=selectedFoods.filter(f=>f!==food);
  else selectedFoods.push(food);
  const input=document.getElementById('contentsInput');
  input.value='';
  highlightIdx=-1;
  renderChips();renderFoodDropdown();
  input.focus();
}

function removeFood(food){
  selectedFoods=selectedFoods.filter(f=>f!==food);
  renderChips();
}

function renderChips(){
  const c=document.getElementById('contentsChips');
  c.innerHTML='';
  selectedFoods.forEach(food=>{
    const chip=document.createElement('span');
    chip.className='chip';
    chip.innerHTML=food+' <span class="chip-x" onclick="removeFood(\''+food.replace(/'/g,"\\'")+'\')">&times;</span>';
    c.appendChild(chip);
  });
}

function pickSeverity(btn){
  document.querySelectorAll('.sev-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedSeverity=btn.dataset.val;
}

function formatDateTime(dtLocal){
  // Convert "2026-09-08T21:48" to "9/8/2026 9:48 PM" so Sheets recognizes it as a date
  const d=new Date(dtLocal);
  const month=d.getMonth()+1;
  const day=d.getDate();
  const year=d.getFullYear();
  let hours=d.getHours();
  const mins=String(d.getMinutes()).padStart(2,'0');
  const ampm=hours>=12?'PM':'AM';
  hours=hours%12||12;
  return month+'/'+day+'/'+year+' '+hours+':'+mins+' '+ampm;
}

async function submitMeal(){
  const dt=formatDateTime(document.getElementById('mealDateTime').value);
  const mt=document.getElementById('mealType').value;
  const notes=document.getElementById('mealNotes').value.trim();
  if(!mt)return showToast('Please select a meal type.','error');
  if(!selectedFoods.length)return showToast('Please select at least one food item.','error');
  const btn=document.getElementById('mealSubmit');
  btn.disabled=true;btn.textContent='Logging\u2026';
  const ok=await appendRow('Meals',[dt,mt,selectedFoods.join(', '),notes]);
  btn.disabled=false;btn.textContent='Log Meal';
  if(ok){showToast('\u2713 Meal logged!','success');resetMealForm();setTimeout(()=>showScreen('landing'),800);}
}

async function submitSymptom(){
  const dt=formatDateTime(document.getElementById('symptomDateTime').value);
  const notes=document.getElementById('symptomNotes').value.trim();
  if(!selectedSeverity)return showToast('Please select a severity level.','error');
  if(!selectedSymptoms.length)return showToast('Please select at least one symptom.','error');
  const btn=document.getElementById('symptomSubmit');
  btn.disabled=true;btn.textContent='Logging\u2026';
  const ok=await appendRow('Symptoms',[dt,selectedSeverity,selectedSymptoms.join(', '),notes]);
  btn.disabled=false;btn.textContent='Log Symptoms';
  if(ok){showToast('\u2713 Symptoms logged!','success');resetSymptomForm();setTimeout(()=>showScreen('landing'),800);}
}

async function appendRow(sheetName,values){
  if(!accessToken){showToast('Please sign in first.','error');showScreen('auth');return false;}
  const url=SHEETS_API+encodeURIComponent(sheetName+'!A:D')+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS';
  try{
    const r=await fetch(url,{
      method:'POST',
      headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
      body:JSON.stringify({values:[values]})
    });
    if(r.ok)return true;
    if(r.status===401||r.status===403){
      accessToken=null;
      localStorage.removeItem('ft_token');
      localStorage.removeItem('ft_token_expiry');
      showToast('Session expired \u2014 please sign in again.','error');
      setTimeout(()=>showScreen('auth'),1500);
      return false;
    }
    const err=await r.json().catch(()=>({}));
    showToast(err.error?.message||'Error writing to sheet ('+r.status+')','error');
    return false;
  }catch(e){showToast('Network error \u2014 check your connection.','error');return false;}
}

function resetMealForm(){
  document.getElementById('mealType').selectedIndex=0;
  selectedFoods=[];renderChips();
  document.getElementById('mealNotes').value='';
  setDateTimeNow('mealDateTime');
}

function resetSymptomForm(){
  selectedSeverity='';
  document.querySelectorAll('.sev-btn').forEach(b=>b.classList.remove('active'));
  selectedSymptoms=[];
  document.querySelectorAll('.cb-item').forEach(item=>{
    item.classList.remove('checked');
    item.querySelector('input').checked=false;
    item.querySelector('.cb-box').textContent='';
  });
  document.getElementById('symptomNotes').value='';
  setDateTimeNow('symptomDateTime');
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
